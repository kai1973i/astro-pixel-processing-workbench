<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Pixel Processing Workbench</title>
    <meta http-equiv="refresh" content="0; URL=src/index.html">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
        }
        .container {
            text-align: center;
        }
        h1 { margin-bottom: 0.5em; }
        p { color: #aaa; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #4a90d9;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Astro Pixel Processing Workbench</h1>
        <p>Lädt... <span class="loading"></span></p>
    </div>
    <script>
        // Redirect to the actual application
        window.location.href = 'src/index.html';
    </script>
</body>
</html>
